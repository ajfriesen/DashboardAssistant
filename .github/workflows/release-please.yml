name: release-please

# Automates versioning + releases from Conventional Commit messages, reading the
# commit history on `main` — so it picks up commits pushed straight to main *and*
# commits that arrive via a merged branch/PR (message must follow feat:/fix:/…).
#
# On every push to main it opens/updates a single "release PR" that bumps
# CHANGELOG.md and flake.nix's version. Merging it creates the vX.Y.Z tag and
# GitHub Release. It authenticates with a PAT (RELEASE_PLEASE_TOKEN) so that tag
# *does* start the tag-triggered build of every board's closure and image
# (boards.yml) — a tag made by the default GITHUB_TOKEN wouldn't.
# Use the hardware target as the commit scope (feat(rpi5):/fix(x86):); daemon/core
# (or no scope) for changes that apply to all.
#
# Prereleases: force one with a `Release-As: 0.3.0-rc.1` commit footer, usually on
# an empty commit (`git commit --allow-empty`). A tag with a SemVer prerelease
# suffix (a hyphen) publishes its images to pre-release/ rather than release/.
#
# Every release starts as a *candidate*: published, but held off the update path
# until the release gate on the bench has passed and it is promoted. See
# docs/adr/0011-a-release-is-promoted-after-the-release-gate.md. That is what the
# "Hold the release back as a candidate" step below does, and it is why a release
# has no download links in its notes when it is first cut — promotion writes
# them. A candidate is held back by marking it a GitHub pre-release, which is the
# documented way to keep it out of /releases/latest: that endpoint returns the
# newest non-prerelease, non-draft release, and `modules/core/update.nix` polls
# it on an hourly interval. Nothing else reaches a device by itself.
#
# No paths-ignore here: a `paths-ignore` filter skips pushes that change no
# matching files, and an empty commit changes *no* files at all — so filtering
# would silently swallow the `Release-As` empty commits above. Running on every
# push (docs included) is cheap and harmless: docs: commits don't bump the
# version, so no spurious release is cut.
on:
  push:
    branches: [main]

permissions:
  contents: write # create the release PR, tag and GitHub Release
  pull-requests: write # open/update the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # PAT so the created tag triggers the image build workflows. Falls back
          # to the default token if the secret isn't set (releases still work, but
          # the image builds won't start until RELEASE_PLEASE_TOKEN is configured).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Hold the release back as a candidate: a pre-release, and not "latest", so
      # no device is offered it and the releases page does not hand it out. This
      # applies to *every* tag, not only the hyphened ones — a full release is a
      # candidate too until the bench has booted its images. Promotion reverses
      # exactly this.
      - name: Hold the release back as a candidate
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
          {
            echo "### 🚧 $TAG is a candidate"
            echo
            echo "Its images publish to R2 in a few minutes, but nothing points at"
            echo "them: the release is held off \`/releases/latest\`, which"
            echo "\`modules/core/update.nix\` polls, and its notes carry no download"
            echo "links. Run the release gate on the bench, then promote it."
            echo
            echo "Until the gate has a single entry point, by hand:"
            echo
            echo '```sh'
            echo "just hw-preflight     # is the bench healthy?"
            echo "just hw-test          # the Pi 5 bench"
            echo "just qemu-test        # the x86_64 image under QEMU"
            echo "gh release edit $TAG --draft=false --prerelease=false --latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

