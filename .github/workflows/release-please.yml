name: release-please

# Automates versioning + releases from Conventional Commit messages, reading the
# commit history on `main` — so it picks up commits pushed straight to main *and*
# commits that arrive via a merged branch/PR (message must follow feat:/fix:/…).
#
# On every push to main it opens/updates a single "release PR" that bumps
# CHANGELOG.md and flake.nix's version. Merging it creates the vX.Y.Z tag and
# GitHub Release. It authenticates with a PAT (RELEASE_PLEASE_TOKEN) so that tag
# *does* start the tag-triggered image builds (release-image.yml for x86_64,
# cache-rpi.yml for the Pis) — a tag made by the default GITHUB_TOKEN wouldn't.
# Use the hardware target as the commit scope (feat(rpi5):/fix(x86):); daemon/core
# (or no scope) for changes that apply to all.
#
# Prereleases: force one with a `Release-As: 0.3.0-rc.1` commit footer, usually on
# an empty commit (`git commit --allow-empty`). The step below flags any release
# whose tag has a SemVer prerelease suffix (a hyphen) as a GitHub pre-release; its
# images go to pre-release/ (not release/), off the stable update path.
#
# No paths-ignore here: a `paths-ignore` filter skips pushes that change no
# matching files, and an empty commit changes *no* files at all — so filtering
# would silently swallow the `Release-As` empty commits above. Running on every
# push (docs included) is cheap and harmless: docs: commits don't bump the
# version, so no spurious release is cut.
on:
  push:
    branches: [main]

permissions:
  contents: write # create the release PR, tag and GitHub Release
  pull-requests: write # open/update the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # PAT so the created tag triggers the image build workflows. Falls back
          # to the default token if the secret isn't set (releases still work, but
          # the image builds won't start until RELEASE_PLEASE_TOKEN is configured).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Flag prerelease versions (tag contains a hyphen) as GitHub pre-releases and
      # drop them from "latest", so they stay off the stable update path.
      - name: Mark prereleases
        if: ${{ steps.release.outputs.release_created == 'true' && contains(steps.release.outputs.tag_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false

      # Write the per-board download links into the release notes. URLs are
      # deterministic from the tag + channel, so we write them here once (no race
      # between the parallel image workflows); the objects appear a few minutes
      # later as those builds finish. Skipped without R2_PUBLIC_URL (e.g. forks).
      - name: Add image download links to the release notes
        if: ${{ steps.release.outputs.release_created == 'true' && vars.R2_PUBLIC_URL != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          case "$TAG" in *-*) channel=pre-release ;; *) channel=release ;; esac
          base="$R2_PUBLIC_URL/$channel"
          x86="$base/x86_64/dashboard-assistant-$version.raw.zst"
          pi5="$base/rpi5/dashboard-assistant-$version.img.zst"
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          notes=$(mktemp)
          {
            echo "## 📥 Download & flash"
            echo
            echo "Flashable images (published to R2 within a few minutes of this release):"
            echo
            echo "| Board | Image |"
            echo "|---|---|"
            echo "| x86_64 | [\`dashboard-assistant-$version.raw.zst\`]($x86) |"
            echo "| Raspberry Pi 4 | [\`dashboard-assistant-$version.img.zst\`]($base/rpi4/dashboard-assistant-$version.img.zst) |"
            echo "| Raspberry Pi 5 | [\`dashboard-assistant-$version.img.zst\`]($pi5) |"
            echo
            echo "x86_64 — write to the target's internal disk (confirm the device first!):"
            echo '```'
            echo "curl -L \"$x86\" | zstd -dc | sudo dd of=/dev/sdX bs=4M oflag=sync conv=fsync status=progress"
            echo '```'
            echo
            echo "Raspberry Pi — write the SD image:"
            echo '```'
            echo "curl -L \"$pi5\" | zstd -dc | sudo dd of=/dev/mmcblkX bs=4M oflag=sync conv=fsync status=progress"
            echo '```'
            echo
            printf '%s\n' "$body"
          } > "$notes"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
