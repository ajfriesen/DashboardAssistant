name: cache-rpi

# Build the aarch64 Raspberry Pi systems on a *native* arm64 runner and push the
# whole build closure — most importantly the linux-rpi kernel, which otherwise
# compiles under slow binfmt emulation on an x86 dev box — to the public Attic
# (Nix binary cache) server backed by Cloudflare R2. Once this has run, a local
# `just build-rpi4` / `just build-rpi5` (and any deployed system's OTA update)
# substitutes the kernel + system closure from the cache instead of recompiling
# it. The consuming side is wired up in flake.nix (nixConfig) and
# modules/core/binary-cache.nix.
#
# Both boards run as a matrix; nothing board-specific is needed here, the flake
# attrs already carry it.
#
# Native arm64 (ubuntu-24.04-arm) is free for public repos and builds the kernel
# in real time instead of emulating it, so this workflow is the fast path even
# for the very build it exists to accelerate.
#
# The cache endpoint + name are public (baked into the images), so they live here
# as plain env. Only the push token is secret:
#   Secret ATTIC_TOKEN — an Attic token with push access to the cache
#     (atticadm make-token --sub ci --validity 1y --pull dashboardassistant \
#        --push dashboardassistant).
# The Attic push only runs on the canonical repo; forks build without it.
#
# Two jobs. `build` compiles the aarch64 system closure on a native arm64 runner
# and pushes it to Attic; `image` then assembles the flashable image on an x86
# runner, because disko's image builder boots a QEMU VM and the arm64 runners
# have no /dev/kvm (see that job's comment).
#
# When an image is built it goes to the same Cloudflare R2 bucket the x86_64
# image uses, never to the run itself — GitHub Actions artifacts are far too slow
# to move an image this size. The layout mirrors release-image.yml, with the
# board as both the directory and part of the filename:
#   release/<board>/dashboard-assistant-<board>-<version>.raw.zst
#   pre-release/<board>/…               (same, for a hyphened SemVer tag)
#   dev/<board>/dashboard-assistant-<board>-<commit>.raw.zst
# A v* tag publishes a release; a manual run publishes a dev build keyed by the
# short commit. There is no `latest` object: a release is held back as a
# candidate until the bench has booted its images, and promotion moves GitHub's
# /releases/latest — the pointer devices actually poll. See
# docs/adr/0011-a-release-is-promoted-after-the-release-gate.md. dev/ objects are
# swept after 7 days by the bucket lifecycle policy (ops/r2-lifecycle.json). A plain push to main builds no image
# at all — it only warms the Attic cache above, which is what local
# `just build-rpi*` and SSH-based updates substitute from.
#
# Needs the same repo config as the release workflow (vars R2_ACCOUNT_ID /
# R2_BUCKET / R2_PUBLIC_URL, secrets R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY).
# Without R2_BUCKET — a fork — the image is still built and checked, there is just
# nowhere to publish it to.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Docs-only pushes don't change the Nix build, so don't warm the cache for
    # them. These paths are owned by docs.yml (the GitHub Pages deploy). Note:
    # GitHub ignores path filters for tag pushes, so a v* release tag still
    # always builds and publishes the image below regardless of what it touched.
    paths-ignore:
      - 'docs/**'
      - 'overrides/**'
      - 'zensical.toml'
      - '.github/workflows/docs.yml'
    tags:
      - "v*"

# One in-flight run per branch is enough; a newer push supersedes an older cache
# populate rather than queueing behind it.
concurrency:
  group: cache-rpi-${{ github.ref }}
  cancel-in-progress: true

env:
  ATTIC_ENDPOINT: https://nix-cache.dashboardassistant.org
  ATTIC_CACHE: dashboardassistant
  # EU-jurisdiction R2 endpoint, matching release-image.yml so both write to the
  # same bucket. Flip back to the non-".eu." host if the bucket is not EU.
  R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com

jobs:
  build:
    name: Build ${{ matrix.model }} closure and push to Attic
    runs-on: ubuntu-24.04-arm
    strategy:
      # Don't let a Pi 5 build break cancel an already-succeeding Pi 4 push (or
      # vice versa); each board's cache populate is independent.
      fail-fast: false
      matrix:
        model: [rpi4, rpi5]
    steps:
      - uses: actions/checkout@v7

      # Register the public Attic cache as a system-level substituter (same
      # values as flake.nix nixConfig / modules/core/binary-cache.nix). At system
      # level it's honoured unconditionally, so the pull doesn't depend on the CI
      # user being a trusted Nix user — an already-pushed toplevel substitutes
      # instead of recompiling.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-cache.dashboardassistant.org/dashboardassistant
            extra-trusted-public-keys = dashboardassistant:qyNbqk1+S/2a2dqe7XcDfCGnSGT6ACBXgPr5/4BNLYU=

      # attic-client is prebuilt in nixpkgs, so this pulls the binary from
      # cache.nixos.org instead of compiling the client on the runner.
      - name: Install Attic client
        run: nix profile install github:NixOS/nixpkgs/nixos-26.05#attic-client

      # Build the full system toplevel: its closure references the kernel, initrd
      # and every system package, and that closure — not the image — is what makes
      # a later local build (or an OTA update) a cache hit. This runs on every push
      # so the cache stays warm for local `just build-rpi*` and SSH-based updates.
      # --accept-flake-config honours the flake's Attic substituter (same as the
      # justfile recipes), so an already-cached toplevel a previous run pushed is
      # substituted instead of recompiled. Only a not-yet-cached closure (after a
      # nixpkgs bump, say) compiles.
      - name: Build Pi system (populate the cache)
        run: |
          nix build --print-build-logs --accept-flake-config \
            .#nixosConfigurations.dashboard-assistant-${{ matrix.model }}.config.system.build.toplevel \
            --out-link result-toplevel

      # The Pi boots: GPU firmware -> u-boot.bin -> \EFI\BOOT\BOOTAA64.EFI ->
      # systemd-boot -> Linux. U-Boot is in that chain purely to provide the UEFI
      # environment, which it does through CONFIG_EFI_LOADER (on by default for
      # armv8) and BOOTMETH_EFILOADER, the bit that scans each filesystem for
      # boot<arch>.efi.
      #
      # If a nixpkgs bump ever ships an rpi_arm64_defconfig built without the EFI
      # loader, the image still builds and still flashes, and then U-Boot drops to
      # its own prompt instead of chainloading systemd-boot — a board that never
      # reaches Linux, with nothing in the Nix build to explain why. So assert it
      # here, where it costs a second, instead of discovering it on a card.
      #
      # This replaces the inverse assertion this workflow used to make. The old
      # images needed U-Boot rebuilt with CONFIG_FS_BTRFS=y, because extlinux.conf
      # and the kernel lived on the btrfs root; now they live on the ESP, so the
      # stock package is correct and a btrfs-enabled build would just be dead
      # weight.
      - name: Assert U-Boot provides the UEFI loader
        run: |
          set -euo pipefail
          uboot=$(nix build --no-link --print-out-paths --accept-flake-config \
            ".#nixosConfigurations.dashboard-assistant-${{ matrix.model }}.config.hardware.raspberry-pi.firmware.uboot.package")
          echo "U-Boot: $uboot"
          fail=0
          for sym in BOOTAA64.EFI '/EFI/BOOT/' bootefi; do
            if strings "$uboot/u-boot.bin" | grep -qF "$sym"; then
              echo "OK: $sym present"
            else
              echo "FAIL: u-boot.bin has no '$sym' — it cannot chainload systemd-boot." >&2
              fail=1
            fi
          done
          exit "$fail"

      # Two things have to land on the ESP for a flashed card to boot and to
      # explain itself, and they get there by different routes. Both failures are
      # quiet and both ship a broken card, so assert the wiring by eval.
      #
      #   - the Raspberry Pi boot chain (config.txt, u-boot.bin, DTBs, overlays/)
      #     comes from a disko postMountHook in rpi-disk-image.nix, because
      #     nixos-install ends in `switch-to-configuration boot`, which installs
      #     the bootloader and exits *before* activation — so nixos-hardware's
      #     activation script cannot do this job at image build time. Lose the
      #     hook and the board flashes the green LED seven times and says nothing.
      #   - the seed-file README and example come from systemd-boot's extraFiles
      #     (modules/core/configimport.nix). Lose them and seeding still works but
      #     the partition stops explaining itself to whoever opens the card.
      - name: Assert the ESP carries the boot chain and the seed-file drop zone
        run: |
          set -euo pipefail
          attr=".#nixosConfigurations.dashboard-assistant-${{ matrix.model }}.config"
          fail=0

          hook=$(nix eval --raw --accept-flake-config \
            "$attr.disko.devices.disk.main.content.partitions.ESP.content.postMountHook")
          echo "$hook"
          for want in config.txt u-boot.bin overlays; do
            grep -q "$want" <<<"$hook" || {
              echo "FAIL: the ESP staging hook no longer installs $want." >&2
              fail=1
            }
          done

          extra=$(nix eval --json --accept-flake-config \
            "$attr.boot.loader.systemd-boot.extraFiles" | nix run nixpkgs#jq -- -r 'keys[]')
          echo "extraFiles: $extra"
          for want in README.txt dashboard-assistant.yaml.example; do
            grep -qx "$want" <<<"$extra" || {
              echo "FAIL: $want is not staged onto the ESP via systemd-boot extraFiles." >&2
              fail=1
            }
          done
          exit "$fail"

      - name: Push closures to Attic
        if: ${{ github.repository == 'ajfriesen/DashboardAssistant' }}
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail
          attic login ci "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"
          # Push ONLY the system toplevel closure — the kernel, its modules and
          # every system package. We deliberately do NOT push the image: the SD
          # image blob doesn't retain store references to the kernel, so it's
          # useless as a substitution target and it's the single largest object
          # (routinely >100 MB), which is exactly what the ingress chokes on. The
          # flashable image itself is published to R2 above.
          attic push "ci:$ATTIC_CACHE" result-toplevel

  # Assemble and publish the flashable image — on x86, deliberately, even though
  # the image is aarch64.
  #
  # disko builds images by booting a QEMU VM. The arm64 runners above have no
  # /dev/kvm, so an aarch64 guest there would fall back to TCG: emulation on top
  # of no acceleration. Here the VM is x86 and runs natively
  # (dashboardAssistant.diskImage.builderPkgs), and the only emulated part is
  # nixos-install's chroot into the aarch64 system. The expensive half — the
  # kernel and the system closure — was already compiled natively by the job
  # above and comes back out of Attic.
  #
  # Built for a v* tag release, and on a manual run so a branch can produce a
  # flashable image to test with. A push to main only warms the cache.
  image:
    name: Build and publish ${{ matrix.model }} image
    needs: build
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        model: [rpi4, rpi5]
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-platforms = aarch64-linux
            extra-substituters = https://nix-cache.dashboardassistant.org/dashboardassistant
            extra-trusted-public-keys = dashboardassistant:qyNbqk1+S/2a2dqe7XcDfCGnSGT6ACBXgPr5/4BNLYU=

      # Register aarch64 binfmt handlers with the `F` (fix-binary) flag, which is
      # what makes them usable from inside a chroot — exactly what
      # nixos-install does, and the reason disko's docs ask for
      # `boot.binfmt.preferStaticEmulators` on a NixOS build host. Without it the
      # image build dies with "chroot: failed to run command '…/activate': No
      # such file or directory", which does not look like an emulation problem at
      # all.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install AWS CLI
        if: ${{ vars.R2_BUCKET != '' }}
        run: nix profile install github:NixOS/nixpkgs/nixos-26.05#awscli2

      - name: Build Pi image
        run: |
          # The x86_64-linux bucket explicitly: these runners cross-build the
          # aarch64 image under binfmt with an x86 builder VM. The
          # aarch64-linux bucket carries the native-builder wiring instead.
          nix build --print-build-logs --accept-flake-config \
            .#packages.x86_64-linux.${{ matrix.model }}-image \
            --out-link result-${{ matrix.model }}

      # disko emits a single uncompressed .raw, unlike the old sd-image builder
      # which produced .img.zst itself. Compress it here rather than in the
      # image derivation: it keeps the build output identical to the x86 target's
      # and keeps a ~4 GiB zstd pass out of every local `just build-rpi5`.
      - name: Compress the image
        run: |
          set -euo pipefail
          raw=$(ls result-${{ matrix.model }}/*.raw)
          nix run nixpkgs#zstd -- -T0 -19 --long=27 "$raw" -o image.raw.zst
          ls -l image.raw.zst

      # Publish to R2 (mirrors release-image.yml): a v* tag goes to
      # release/<board>/ — or pre-release/<board>/ for a hyphened prerelease tag
      # — as an immutable versioned object; a manual run goes to dev/<board>/
      # keyed by the short commit. Nothing points at any of them until the
      # release is promoted.
      - name: Publish image to R2
        if: ${{ vars.R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          model="${{ matrix.model }}"
          bucket="${{ vars.R2_BUCKET }}"
          img=image.raw.zst
          nixos=$(nix eval --raw ".#nixosConfigurations.dashboard-assistant-${model}.config.system.nixos.version")
          baked=$(nix eval --raw \
            ".#nixosConfigurations.dashboard-assistant-${model}.config.environment.etc.\"dashboard-assistant/version\".text")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            case "$GITHUB_REF_NAME" in *-*) channel=pre-release ;; *) channel=release ;; esac
            id="$version"
          else
            # Dev build: the commit is the identity, not the version.
            version="$baked"
            channel=dev
            id="${GITHUB_SHA::7}"
          fi
          dir="$channel/$model"
          name="dashboard-assistant-$model-$id.raw.zst"
          sha=$(sha256sum "$img" | cut -d' ' -f1)
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Metadata (x-amz-meta-*) attached to every object; see release-image.yml.
          # `ref` is the tag on a release build and the branch on a dev one.
          meta="board=$model,arch=aarch64,channel=$channel,version=$version,ref=$GITHUB_REF_NAME,commit=$GITHUB_SHA,nixos-version=$nixos,built=$built,sha256=$sha,run-url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          aws s3 cp "$img" "s3://$bucket/$dir/$name" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/zstd \
            --metadata "$meta"
          size=$(du -h "$img" | cut -f1)
          {
            echo "### 📦 $model image published to $dir/"
            echo
            echo "**[$name](${{ vars.R2_PUBLIC_URL }}/$dir/$name)** ($size)"
            echo
            echo "nixos \`$nixos\` · commit \`${GITHUB_SHA::7}\` · sha256 \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # A fork without R2 config: the image is built and checked, but there is
      # nowhere to put it — and it is far too large to hand back as a run
      # artifact, so say so plainly instead of failing at the upload.
      - name: Note that publishing was skipped
        if: ${{ vars.R2_BUCKET == '' }}
        run: |
          {
            echo "### ${{ matrix.model }} image built, not published"
            echo
            echo "\`R2_BUCKET\` is not configured for this repository, so there is"
            echo "nowhere to publish the image to. See the workflow header for the"
            echo "variables and secrets it needs."
          } >> "$GITHUB_STEP_SUMMARY"
