name: cache-rpi

# Build the aarch64 Raspberry Pi systems on a *native* arm64 runner and push the
# whole build closure — most importantly the linux-rpi kernel, which otherwise
# compiles under slow binfmt emulation on an x86 dev box — to the public Attic
# (Nix binary cache) server backed by Cloudflare R2. Once this has run, a local
# `just build-rpi4` / `just build-rpi5` (and any deployed system's OTA update)
# substitutes the kernel + system closure from the cache instead of recompiling
# it. The consuming side is wired up in flake.nix (nixConfig) and
# modules/core/binary-cache.nix.
#
# Both boards run as a matrix. The Pi 4 builds from the pinned nixpkgs (26.05);
# the Pi 5 is pinned to nixpkgs-unstable in flake.nix (its kernel + sd-image pi5
# support are newer than 26.05) — nothing board-specific is needed here, the
# flake attrs already carry that.
#
# Native arm64 (ubuntu-24.04-arm) is free for public repos and builds the kernel
# in real time instead of emulating it, so this workflow is the fast path even
# for the very build it exists to accelerate.
#
# The cache endpoint + name are public (baked into the images), so they live here
# as plain env. Only the push token is secret:
#   Secret ATTIC_TOKEN — an Attic token with push access to the cache
#     (atticadm make-token --sub ci --validity 1y --pull dashboardassistant \
#        --push dashboardassistant).
# The Attic push only runs on the canonical repo; forks build without it.
#
# When an SD image is built it goes to the same Cloudflare R2 bucket the x86_64 image
# uses, never to the run itself — GitHub Actions artifacts are far too slow to
# move an image this size. The layout mirrors release-image.yml, with the board as
# both the directory and part of the filename:
#   release/<board>/dashboard-assistant-<board>-<version>.img.zst
#   release/<board>/latest.img.zst                    (newest full release)
#   pre-release/<board>/…               (same, for a hyphened SemVer tag)
#   dev/<board>/dashboard-assistant-<board>-<commit>.img.zst
# A v* tag publishes a release; a manual run publishes a dev build keyed by the
# short commit, so a branch can be tested without ever touching the `latest`
# pointer people flash. dev/ objects are swept after 7 days by the bucket
# lifecycle policy (ops/r2-lifecycle.json). A plain push to main builds no image
# at all — it only warms the Attic cache above, which is what local
# `just build-rpi*` and SSH-based updates substitute from.
#
# Needs the same repo config as the release workflow (vars R2_ACCOUNT_ID /
# R2_BUCKET / R2_PUBLIC_URL, secrets R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY).
# Without R2_BUCKET — a fork — the image is still built and checked, there is just
# nowhere to publish it to.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Docs-only pushes don't change the Nix build, so don't warm the cache for
    # them. These paths are owned by docs.yml (the GitHub Pages deploy). Note:
    # GitHub ignores path filters for tag pushes, so a v* release tag still
    # always builds and publishes the image below regardless of what it touched.
    paths-ignore:
      - 'docs/**'
      - 'overrides/**'
      - 'zensical.toml'
      - '.github/workflows/docs.yml'
    tags:
      - "v*"

# One in-flight run per branch is enough; a newer push supersedes an older cache
# populate rather than queueing behind it.
concurrency:
  group: cache-rpi-${{ github.ref }}
  cancel-in-progress: true

env:
  ATTIC_ENDPOINT: https://nix-cache.dashboardassistant.org
  ATTIC_CACHE: dashboardassistant
  # EU-jurisdiction R2 endpoint, matching release-image.yml so both write to the
  # same bucket. Flip back to the non-".eu." host if the bucket is not EU.
  R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com

jobs:
  build:
    name: Build ${{ matrix.model }} system and push to Attic
    runs-on: ubuntu-24.04-arm
    strategy:
      # Don't let a Pi 5 build break cancel an already-succeeding Pi 4 push (or
      # vice versa); each board's cache populate is independent.
      fail-fast: false
      matrix:
        model: [rpi4, rpi5]
    steps:
      - uses: actions/checkout@v7

      # Register the public Attic cache as a system-level substituter (same
      # values as flake.nix nixConfig / modules/core/binary-cache.nix). At system
      # level it's honoured unconditionally, so the pull doesn't depend on the CI
      # user being a trusted Nix user — an already-pushed toplevel substitutes
      # instead of recompiling.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-cache.dashboardassistant.org/dashboardassistant
            extra-trusted-public-keys = dashboardassistant:qyNbqk1+S/2a2dqe7XcDfCGnSGT6ACBXgPr5/4BNLYU=

      # attic-client is prebuilt in nixpkgs, so this pulls the binary from
      # cache.nixos.org instead of compiling the client on the runner.
      - name: Install Attic client
        run: nix profile install github:NixOS/nixpkgs/nixos-26.05#attic-client

      # aws CLI isn't guaranteed on the arm64 runner image, so pull the prebuilt
      # binary from cache.nixos.org (only needed when we actually upload to R2).
      - name: Install AWS CLI
        if: ${{ vars.R2_BUCKET != '' }}
        run: nix profile install github:NixOS/nixpkgs/nixos-26.05#awscli2

      # Build the full system toplevel: its closure references the kernel, initrd
      # and every system package, and that closure — not the image — is what makes
      # a later local build (or an OTA update) a cache hit. This runs on every push
      # so the cache stays warm for local `just build-rpi*` and SSH-based updates.
      # --accept-flake-config honours the flake's Attic substituter (same as the
      # justfile recipes), so an already-cached toplevel — e.g. the Pi 4 closure a
      # previous run pushed — is substituted instead of recompiled. Only a
      # not-yet-cached board (a fresh Pi 5, or after a nixpkgs bump) compiles.
      - name: Build Pi system (populate the cache)
        run: |
          nix build --print-build-logs --accept-flake-config \
            .#nixosConfigurations.dashboard-assistant-${{ matrix.model }}.config.system.build.toplevel \
            --out-link result-toplevel

      # Built for a v* tag release, and on a manual run so a branch can produce a
      # flashable image to test with. A push to main only warms the cache above.
      - name: Build Pi image
        if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        run: |
          nix build --print-build-logs --accept-flake-config \
            .#packages.aarch64-linux.${{ matrix.model }}-image \
            --out-link result-${{ matrix.model }}

      # Publish the flashable SD image to R2 (mirrors release-image.yml): a v* tag
      # goes to release/<board>/ — or pre-release/<board>/ for a hyphened
      # prerelease tag — as an immutable versioned object plus a `latest` pointer;
      # a manual run goes to dev/<board>/ keyed by the short commit, with no
      # pointer, so a test build can never become the image people flash. The
      # sd-image is already zstd-compressed, so we cp it straight to R2.
      - name: Publish SD image to R2
        if: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && vars.R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          model="${{ matrix.model }}"
          bucket="${{ vars.R2_BUCKET }}"
          img=$(ls result-"$model"/sd-image/*.img.zst)
          nixos=$(nix eval --raw ".#nixosConfigurations.dashboard-assistant-${model}.config.system.nixos.version")
          baked=$(nix eval --raw \
            ".#nixosConfigurations.dashboard-assistant-${model}.config.environment.etc.\"dashboard-assistant/version\".text")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            case "$GITHUB_REF_NAME" in *-*) channel=pre-release ;; *) channel=release ;; esac
            id="$version"
          else
            # Dev build: the commit is the identity, not the version.
            version="$baked"
            channel=dev
            id="${GITHUB_SHA::7}"
          fi
          dir="$channel/$model"
          name="dashboard-assistant-$model-$id.img.zst"
          sha=$(sha256sum "$img" | cut -d' ' -f1)
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Metadata (x-amz-meta-*) attached to every object; see release-image.yml.
          # `ref` is the tag on a release build and the branch on a dev one.
          meta="board=$model,arch=aarch64,channel=$channel,version=$version,ref=$GITHUB_REF_NAME,commit=$GITHUB_SHA,nixos-version=$nixos,built=$built,sha256=$sha,run-url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          keys=("$dir/$name")
          [ "$channel" = dev ] || keys+=("$dir/latest.img.zst")
          for key in "${keys[@]}"; do
            aws s3 cp "$img" "s3://$bucket/$key" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/zstd \
              --metadata "$meta"
          done
          size=$(du -h "$img" | cut -f1)
          {
            echo "### 📦 $model image published to $dir/"
            echo
            echo "**[$name](${{ vars.R2_PUBLIC_URL }}/$dir/$name)** ($size)"
            echo
            echo "nixos \`$nixos\` · commit \`${GITHUB_SHA::7}\` · sha256 \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # A fork without R2 config: the image is built and checked, but there is
      # nowhere to put it — and it is far too large to hand back as a run
      # artifact, so say so plainly instead of failing at the upload.
      - name: Note that publishing was skipped
        if: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && vars.R2_BUCKET == '' }}
        run: |
          {
            echo "### ${{ matrix.model }} image built, not published"
            echo
            echo "\`R2_BUCKET\` is not configured for this repository, so there is"
            echo "nowhere to publish the image to. See the workflow header for the"
            echo "variables and secrets it needs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push closures to Attic
        if: ${{ github.repository == 'ajfriesen/DashboardAssistant' }}
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail
          attic login ci "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"
          # Push ONLY the system toplevel closure — the kernel, its modules and
          # every system package. We deliberately do NOT push the image: the SD
          # image blob doesn't retain store references to the kernel, so it's
          # useless as a substitution target and it's the single largest object
          # (routinely >100 MB), which is exactly what the ingress chokes on. The
          # flashable image itself is published to R2 above.
          attic push "ci:$ATTIC_CACHE" result-toplevel
