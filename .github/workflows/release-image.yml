name: release image

# Build the flashable x86_64 disk image for a release and publish it to R2.
# Triggered by the v* tag that release-please creates — which only starts this
# workflow because release-please authenticates with a PAT (RELEASE_PLEASE_TOKEN);
# tags made by the default GITHUB_TOKEN don't start new runs. The Raspberry Pi
# images are published in parallel by cache-rpi.yml (also tag-triggered), and the
# release notes' download links are written by release-please.yml.
#
# R2 layout (channel decided by the tag: a hyphen like v0.1.0-rc.1 => pre-release):
#   release/x86_64/dashboard-assistant-<version>.raw.zst      (immutable, per release)
#   release/x86_64/latest.raw.zst                             (newest full release)
#   pre-release/x86_64/…                                      (same, for prereleases)
#
# Required repo config (Settings -> Secrets and variables -> Actions):
#   Variables: R2_ACCOUNT_ID, R2_BUCKET, R2_PUBLIC_URL
#   Secrets:   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read # checkout only; the release notes are written by release-please.yml

jobs:
  image:
    name: Build x86_64 disk image and publish to R2
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4 # checks out the tagged commit by default

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Channel + version from the tag. A hyphen (SemVer prerelease, e.g. -rc.1)
      # routes to pre-release/; the leading "v" is stripped for the filename.
      - name: Resolve channel and version
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          case "$TAG" in *-*) channel=pre-release ;; *) channel=release ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "asset=dashboard-assistant-$version.raw.zst" >> "$GITHUB_OUTPUT"

      # Guard: the baked version must match the tag. release-please bumps flake.nix
      # in the release PR, so this always holds — it just catches a mistake.
      - name: Verify baked version matches tag
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          baked=$(nix eval --raw \
            '.#nixosConfigurations.dashboard-assistant-x86-disk.config.environment.etc."dashboard-assistant/version".text')
          echo "baked version = $baked, tag version = $VERSION"
          if [ "$baked" != "$VERSION" ]; then
            echo "::error::flake.nix version ($baked) != release version ($VERSION)"
            exit 1
          fi

      # Build first so a failure aborts before we touch R2. This is the flashable
      # on-disk system (disko btrfs+zstd raw image).
      - name: Build x86_64 disk image
        run: nix build .#disk-image

      - name: Compress disk image
        run: |
          set -euo pipefail
          zstd -19 -T0 -c "$(readlink -f result)/dashboard-assistant.raw" > "${{ steps.v.outputs.asset }}"

      # Publish the immutable versioned object and overwrite the channel's `latest`
      # pointer (the single flashable artifact for that channel/board).
      - name: Upload image to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ASSET: ${{ steps.v.outputs.asset }}
          CHANNEL: ${{ steps.v.outputs.channel }}
        run: |
          set -euo pipefail
          bucket="${{ vars.R2_BUCKET }}"
          dir="$CHANNEL/x86_64"
          aws s3 cp "$ASSET" "s3://$bucket/$dir/$ASSET"          --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$ASSET" "s3://$bucket/$dir/latest.raw.zst"  --endpoint-url "$R2_ENDPOINT"
          {
            echo "### 📦 x86_64 image published to $dir/"
            echo
            echo "**${{ vars.R2_PUBLIC_URL }}/$dir/$ASSET**"
          } >> "$GITHUB_STEP_SUMMARY"
