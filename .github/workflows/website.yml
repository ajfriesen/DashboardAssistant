name: Website
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # The website is one self-contained Zensical project, so a single path
      # covers its config, its theme overrides and its content.
      - 'website/**'
      - '.github/workflows/website.yml'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      # zensical.toml is not at the repository root: it lives with the website
      # it configures, and the build looks for it in the current directory.
      - run: zensical build --clean
        working-directory: website
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/site
      - uses: actions/deploy-pages@v5
        id: deployment
