# NixOS VM tests on every push/PR. GitHub's Linux runners have KVM enabled, so
# the QEMU-based tests run at native speed. first-boot is a full boot of the core
# config with assertions on the things that have actually broken in the field
# (ordering cycles, tmpfiles, seed provisioning).
#
# The other entries are cheap eval-time checks for wiring no VM test can reach:
# first-boot disables greetd, so the Chromium command line is invisible to it,
# and the screenshot path is split across a Nix writer and a Go reader.
# one-nixpkgs is the only job that reads the Pi configs. Every name in the
# matrix must exist in flake.nix's checks.<system>, and every check there must
# appear here or it never runs on a PR.
name: vm-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [first-boot, kiosk-flash-flags, screenshot-path-agreement, one-nixpkgs, release-has-no-unattended-access]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build .#checks.x86_64-linux.${{ matrix.check }} --accept-flake-config -L
