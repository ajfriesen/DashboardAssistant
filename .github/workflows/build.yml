name: build

# Regular (non-release) x86_64 image builds. On every push to main (and on manual
# dispatch) this builds the flashable on-disk disk images and publishes them to
# the same Cloudflare R2 bucket as the tagged releases, under a dev/ prefix keyed
# by build date + short commit SHA (never a tag, never a GitHub Release). Set an
# R2 lifecycle rule to expire objects under dev/ so these snapshots self-clean.
#
# Two variants build in a matrix:
#   x86_64      — the stable disk image (.#disk-image)
#   x86_64-dev  — the dev disk image (.#disk-image-dev). NOTE this bakes root SSH
#                 keys + remote debugging into a PUBLIC download. It is published
#                 on regular builds only; tagged releases (release.yml) ship the
#                 stable image alone.
#
# Uses the same repo config as release.yml (vars R2_ACCOUNT_ID / R2_BUCKET /
# R2_PUBLIC_URL, secrets R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY). Without
# R2_BUCKET the R2 step is skipped and the image falls back to a (slow) workflow
# artifact so contributors without secrets still get something flashable.
on:
  workflow_dispatch:
  push:
    branches: [main]

# One in-flight run per branch is enough; a newer push supersedes an older build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build ${{ matrix.name }} disk image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            flake: disk-image
          - name: x86_64-dev
            flake: disk-image-dev
    env:
      R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build disk image
        run: nix build .#${{ matrix.flake }}

      # Date first so the bucket listing sorts chronologically; short SHA pins it
      # to the exact commit. Compress straight from the Nix store so we never
      # keep a second uncompressed copy of the multi-GB raw on the runner.
      - name: Compress disk image under a dated, commit-stamped name
        id: stage
        run: |
          set -euo pipefail
          asset="dashboard-assistant-$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}-${{ matrix.name }}.raw.zst"
          zstd -19 -T0 -c "$(readlink -f result)/dashboard-assistant.raw" > "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      # Publish under dev/ (separate from tagged releases). Skipped without R2
      # config, in which case the artifact fallback below runs instead.
      - name: Upload dev build to R2
        if: ${{ vars.R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          asset="${{ steps.stage.outputs.asset }}"
          bucket="${{ vars.R2_BUCKET }}"
          aws s3 cp "$asset" "s3://$bucket/dev/$asset" \
            --endpoint-url "$R2_ENDPOINT"
          {
            echo "### 📦 ${{ matrix.name }} dev build published"
            echo
            echo "**[$asset](${{ vars.R2_PUBLIC_URL }}/dev/$asset)** — commit ${GITHUB_SHA::7}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Fallback for forks without R2 config so the build still leaves something
      # flashable (slower to download than R2).
      - name: Upload image artifact
        if: ${{ vars.R2_BUCKET == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-assistant-${{ matrix.name }}-image
          path: ${{ steps.stage.outputs.asset }}
          if-no-files-found: error
