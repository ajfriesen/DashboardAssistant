# labgrid environment for the hardware bench: one Raspberry Pi 5 whose SD card is
# held by a USB-SD-Mux, watched over a Raspberry Pi Debug Probe and powered
# through a Shelly plug.
#
# None of that hardware is attached to the machine running the tests. It hangs off
# the bench host, which exports it through a labgrid coordinator, so this file
# names the *place* and nothing else: the resource identities (mux serial, probe
# serial, plug address) are declared once in the bench host's NixOS module and
# there is no second copy here to drift from them. See
# docs/adr/0010-the-bench-is-driven-through-a-labgrid-coordinator.md.
#
# Needs two things in the environment, both defaulted by the justfile:
#
#   LG_COORDINATOR  host:port of the coordinator (the exporter's coordinator too)
#   LG_PLACE        the place to acquire
#
# and the place has to be acquired by you, on this machine — labgrid refuses a
# RemotePlace otherwise ("place ... is not acquired"). Every `just hw-*` recipe
# acquires it if nobody holds it and releases what it acquired; `just hw-acquire`
# holds it across several runs.
targets:
  main:
    resources:
      # Expands into whatever the exporter published for this place:
      # NetworkUSBSDMuxDevice, NetworkSerialPort and NetworkPowerPort. The
      # exporter runs --isolated, so every one of them carries
      # proxy_required and is reached through ssh to the bench host — the dd
      # and the usbsdmux calls run there, and the console comes back over
      # ser2net.
      - RemotePlace:
          name: !template $LG_PLACE

    drivers:
      # The plug is a Shelly, which labgrid speaks natively (shelly_gen1 /
      # shelly_gen2 power backends) — model, address and index come from the
      # exporter's NetworkPowerPort, not from here.
      - NetworkPowerDriver:
          # Seconds between off and on when the driver cycles. A Pi 5 needs a
          # moment with the rail actually down; too short and it never resets.
          delay: 5.0
      # Both of these bind to the exported mux: one switches the card between
      # host and DUT, the other dd's an image onto it while the host holds it.
      # Neither needs a local usbsdmux — USBSDMuxDriver execs it through the
      # resource's command_prefix, i.e. over ssh on the bench host, and
      # USBStorageDriver rsyncs the image there (ManagedFile) and dd's it the
      # same way.
      - USBSDMuxDriver: {}
      - USBStorageDriver: {}
      - SerialDriver: {}
      - ShellDriver:
          # Matches the plain PS1 that modules/dev.nix sets on the *-dev images
          # ("root@dashboard-assistant-a1b2c3:~# "). Read the comment there before
          # touching either side: NixOS' stock prompt carries colour, xterm-title
          # and bracketed-paste escapes, and ShellDriver's `{marker}\s+{prompt}`
          # patterns cannot match across them at all.
          prompt: 'root@[^\s]+:[^\s]*# '
          login_prompt: 'login: '
          username: root
          # Set by modules/dev.nix on the *-dev images only; release images have
          # no password and cannot be driven this way on purpose.
          password: dashboard
          # First boot grows the filesystem and generates a TLS keypair before it
          # ever reaches a login prompt, on an SD card. Be patient.
          login_timeout: 420
      - DashboardAssistantStrategy: {}

# Which board this place drives. Read by the `board` fixture, so an assertion
# about the Pi's boot chain runs here and skips on the QEMU x86_64 target. See
# capability.py for why this is declared rather than measured.
options:
  board: rpi5

imports:
  - strategy.py
