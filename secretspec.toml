[project]
name = "dashboard-assistant-os"
revision = "1.0"

# Declarations only — the actual values live in your secretspec provider (e.g.
# pass/GPG), never in this file. Resolve + inject them with
# `secretspec run -- <cmd>` (see ops/README.md). These back the R2 ops recipes;
# R2_BUCKET is not secret and defaults in the just recipes, so it is not declared.
[profiles.default]
R2_ACCOUNT_ID = { description = "Cloudflare account id for the R2 images bucket", required = true }
AWS_ACCESS_KEY_ID = { description = "R2 S3 API token id (needs bucket-config write on the bucket)", required = true }
AWS_SECRET_ACCESS_KEY = { description = "R2 S3 API token secret", required = true }
