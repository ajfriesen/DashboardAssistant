[project]
name = "dashboard-assistant-os"
revision = "1.0"

# Declarations only — the actual values live in your secretspec provider (e.g.
# pass/GPG), never in this file. Resolve + inject them with
# `secretspec run -- <cmd>` (see ops/README.md).
#
# These back the R2 *management* recipes only — they are not needed to build or
# run the OS — so they are declared optional. The ops recipes still fail fast if
# a value is unset (a guard in the justfile). R2_BUCKET is not secret and defaults
# in the recipes, so it is not declared.
#
# `required = false` is load-bearing on every secret in this file, and spelling it
# out is not redundant: secretspec defaults to `required = true`, and a required
# secret that is not stored makes `secretspec run` refuse to launch the command at
# all. Leaving it off would mean a bench with no R2 credentials — which needs
# none — could not run `secretspec run -- just hw-test`, and a bench with no
# Wi-Fi secret could not run the suite in order to *skip* the Wi-Fi test
# (labgrid/capability.py decides that skip, and it never gets the chance if
# nothing starts).
[profiles.default]
R2_ACCOUNT_ID = { required = false, description = "Cloudflare account id for the R2 images bucket", ref = { item = "Dashboard Assistant/Cloudflare R2 Nix Cache", field = "R2_ACCOUNT_ID" } }
AWS_ACCESS_KEY_ID = { required = false, description = "R2 S3 API token id (needs bucket-config write on the bucket)", ref = { item = "Dashboard Assistant/Cloudflare R2 Nix Cache", field = "AWS_ACCESS_KEY_ID" } }
AWS_SECRET_ACCESS_KEY = { required = false, description = "R2 S3 API token secret", ref = { item = "Dashboard Assistant/Cloudflare R2 Nix Cache", field = "AWS_SECRET_ACCESS_KEY" } }

# The Bench Wi-Fi the hardware bench puts a device on (labgrid/test_wifi.py).
# The access point is the site's, provisioned outside this repository; a bench
# without these skips the Wi-Fi assertions rather than failing them. Optional for
# the same reason as the R2 values above: nothing needs them to build or run the OS.
#
# Note that the passphrase crosses the board's serial console on its way onto
# the card — the console is the only channel to a board with no network — so it
# appears in labgrid/logs/. That directory is gitignored; do not attach a bench
# transcript to a public issue.
#
# Both come off ONE KeePassXC entry, as two of its fields, so `ref` points at
# the entry that already exists rather than letting secretspec create a second
# copy under its own group. `item` is the group path plus the entry title;
# `field` is a standard or custom field on it, and these two are custom ones.
BENCH_WIFI_SSID = { required = false, description = "SSID of the Bench Wi-Fi the test device joins", ref = { item = "Dashboard Assistant/Bench WiFi", field = "SSID" } }
BENCH_WIFI_PSK = { required = false, description = "Passphrase for the Bench Wi-Fi", ref = { item = "Dashboard Assistant/Bench WiFi", field = "PSK" } }
